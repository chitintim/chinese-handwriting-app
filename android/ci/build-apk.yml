# Builds and signs the 墨字帖 Android APK and publishes it as a GitHub Release asset (moxie.apk).
# Lives at android/ci/build-apk.yml in the source tree; copy to .github/workflows/build-apk.yml in the
# PUBLIC repo (chitintim/chinese-handwriting-app) whose root is the hosted web app (GitHub Pages) + download/ page, with the
# same app bundle (without the service worker) in apk-www/ (copied into the APK's assets) and the wrapper sources in android/.
#
# Trigger: push a tag like v1.0.3 (annotated: `git tag -a v1.0.3 -m "what changed"` -> the release notes), or run manually (workflow_dispatch, tag input required).
# versionName = tag without the v, versionCode = major*10000+minor*100+patch (the app compares the latest release's tag with MoBridge.version()).
# Needs repo secrets: MOXIE_KEYSTORE_B64, MOXIE_KEYSTORE_PASSWORD, MOXIE_KEY_ALIAS (see android/ci/set-secrets.sh).
name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update, vMAJOR.MINOR.PATCH (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform and build-tools
        run: |
          set -euo pipefail
          # Use the SDK preinstalled on GitHub's ubuntu runners
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Determine version
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${INPUT_TAG}"
          fi
          # versionName = the tag without the "v"; versionCode = major*10000 + minor*100 + patch (so it follows the tag, not the run number)
          if ! printf '%s' "$TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z._-]*)?$'; then
            echo "::error::Tag must look like v1.2.3 (got: $TAG)"; exit 1
          fi
          NAME="${TAG#v}"
          CORE="${NAME%%[-+]*}"
          MAJOR="${CORE%%.*}"; REST="${CORE#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::minor and patch must be <= 99 for versionCode (got: $TAG)"; exit 1
          fi
          CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG, versionName: $NAME, versionCode: $CODE"

      - name: Stage app bundle (apk-www/) into assets/www
        run: |
          set -euo pipefail
          DEST=android/app/src/main/assets/www
          rm -rf "$DEST"
          mkdir -p "$DEST"
          test -f apk-www/index.html || { echo "::error::apk-www/index.html missing in the repo"; exit 1; }
          rsync -a --exclude='.DS_Store' apk-www/ "$DEST/"
          test -f "$DEST/index.html" && test -f "$DEST/library/index.json" || { echo "::error::app bundle incomplete"; exit 1; }
          echo "Staged $(find "$DEST" -type f | wc -l) files, $(du -sh "$DEST" | cut -f1)"

      - name: Decode signing keystore
        env:
          MOXIE_KEYSTORE_B64: ${{ secrets.MOXIE_KEYSTORE_B64 }}
          MOXIE_KEYSTORE_PASSWORD: ${{ secrets.MOXIE_KEYSTORE_PASSWORD }}
          MOXIE_KEY_ALIAS: ${{ secrets.MOXIE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in MOXIE_KEYSTORE_B64 MOXIE_KEYSTORE_PASSWORD MOXIE_KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set (run android/ci/set-secrets.sh)"; exit 1; fi
          done
          KS="$RUNNER_TEMP/moxie.p12"
          printf '%s' "$MOXIE_KEYSTORE_B64" | base64 -d > "$KS"
          keytool -list -storetype pkcs12 -keystore "$KS" -storepass:env MOXIE_KEYSTORE_PASSWORD -alias "$MOXIE_KEY_ALIAS" | grep -i fingerprint
          echo "MOXIE_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MOXIE_VERSION_CODE: ${{ steps.ver.outputs.code }}
          MOXIE_VERSION_NAME: ${{ steps.ver.outputs.name }}
          MOXIE_KEYSTORE_PASSWORD: ${{ secrets.MOXIE_KEYSTORE_PASSWORD }}
          MOXIE_KEY_ALIAS: ${{ secrets.MOXIE_KEY_ALIAS }}
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature and name the APK
        run: |
          set -euo pipefail
          SRC=android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "::error::Signed APK not found (is it app-release-unsigned.apk?)"; ls -R android/app/build/outputs || true; exit 1; }
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          APKSIGNER="$SDK/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$SRC" | grep -E 'Verifies|SHA-256|Number of signers|Signer #1 certificate DN'
          cp "$SRC" moxie.apk
          ls -l moxie.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moxie-apk
          path: moxie.apk
          if-no-files-found: error

      - name: Release notes (annotated tag message, else the commit subject)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          : > release-notes.txt
          # fetch the tag by name so an annotated tag keeps its message (a checkout by SHA turns it into a lightweight one)
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null && [ "$(git cat-file -t "refs/tags/${TAG}")" = "tag" ]; then
            git tag -l --format='%(contents)' "${TAG}" > release-notes.txt
          fi
          # PGP signature blocks are no release notes
          sed -i.bak '/^-----BEGIN PGP SIGNATURE-----/,$d' release-notes.txt && rm -f release-notes.txt.bak
          if ! grep -q '[^[:space:]]' release-notes.txt; then
            git log -1 --format=%s "${GITHUB_SHA}" > release-notes.txt
          fi
          echo "---- release notes ----"; cat release-notes.txt

      - name: Publish GitHub Release
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VNAME: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" moxie.apk --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file release-notes.txt --latest -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" moxie.apk -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "墨字帖 ${VNAME}" --notes-file release-notes.txt --latest
          fi
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/moxie.apk"
