*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin:0;padding:0;height:100%;background:#fff;color:#000;overflow:hidden;
  font-family:"MoKai TC","PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:20px;line-height:1.35}
#app{position:absolute;left:0;top:0;right:0;bottom:0;background:#fff}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:#000;border-radius:0}
button{min-height:56px;min-width:56px;padding:0 14px;background:#fff;border:2px solid #000;font-size:20px;cursor:pointer;touch-action:manipulation}
button:active,button.on{background:#000;color:#fff}
button:disabled{color:#888;border-color:#888;background:#fff}
button.big{min-height:64px;font-size:24px;padding:0 24px}
input[type=text]{min-height:56px;border:2px solid #000;padding:0 10px;font-size:20px;background:#fff;width:100%;max-width:420px}
textarea{width:100%;min-height:160px;border:2px solid #000;font-size:14px;font-family:monospace;background:#fff}
.screen{position:absolute;left:0;top:0;right:0;bottom:0;overflow:auto;padding:16px 20px 40px;background:#fff;-webkit-overflow-scrolling:touch}
.screen h1{font-size:30px;margin:0 0 12px;font-weight:normal}
.screen h2{font-size:22px;margin:18px 0 8px;font-weight:normal;border-bottom:2px solid #000;padding-bottom:4px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;flex-wrap:wrap}
.topbar>*{margin:0 10px 10px 0}
.topbar>:last-child{margin-right:0}
.topbar .grow{flex:1}
.btnrow{display:flex;flex-wrap:wrap;align-items:center}
.btnrow>*{margin:0 10px 10px 0}
.card{border:2px solid #000;padding:14px 16px;margin:0 0 14px;max-width:760px}
.card .t{font-size:28px}
.card .m{font-size:18px;color:#333;margin:4px 0 10px}
.bar{height:14px;border:2px solid #000;margin:6px 0 10px;max-width:420px}
.bar i{display:block;height:100%;background:#000}
.frow{display:flex;align-items:center;margin:8px 0;flex-wrap:wrap}
.frow>*{margin-right:10px}
.frow label{min-width:92px;font-size:20px}
.seg{display:flex;flex-wrap:wrap}
.seg button{margin-right:-2px}
.seg button.on{background:#000;color:#fff}
.note{font-size:16px;color:#333;margin:4px 0}
.mono{font-family:monospace;font-size:15px;white-space:pre-wrap;word-break:break-all}

/* practice */
.practice{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;background:#fff}
.practice.land{flex-direction:row}
.pbar{display:flex;flex-wrap:wrap;padding:1px;border-bottom:2px solid #000;align-items:center;flex:none;background:#fff}
.practice.land .pbar{flex-direction:column;flex-wrap:nowrap;border-bottom:0;border-right:2px solid #000;width:116px;overflow:auto;justify-content:flex-start}
.pbar>*{margin:3px}
.pbar button{flex:1 1 auto;min-width:64px;padding:0 8px}
.practice.land .pbar button{flex:none;width:calc(100% - 6px)}
.pbar .ctr{min-width:72px;text-align:center;font-size:22px;flex:none}
.stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:#fff;touch-action:none}
.stage canvas{position:absolute;left:0;top:0;touch-action:none;-webkit-user-select:none;user-select:none}
#ink{cursor:crosshair}
.nextbtn{position:absolute;left:50%;bottom:12px;margin-left:-120px;width:240px;min-height:72px;font-size:28px;background:#fff;z-index:5}
.banner{position:absolute;left:8px;right:8px;top:8px;z-index:6;background:#fff;border:2px solid #000;padding:10px 12px;font-size:18px}
.banner .btnrow{margin-top:8px}

/* overlay */
#layer{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:100}
.modal-bg{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(255,255,255,.88);pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:#fff;border:3px solid #000;padding:16px 18px;max-width:760px;width:100%;max-height:96%;overflow:auto}
.modal h2{margin:0 0 10px;font-size:24px;font-weight:normal}
.modal .btnrow{margin-top:14px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;padding:12px 18px;font-size:20px;max-width:90%;pointer-events:none}
.flash{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:auto}
.pt-area{border:2px solid #000;background:#fff;touch-action:none;display:block;width:100%;height:320px}
.pt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 16px;font-size:16px;margin:10px 0}
.pt-grid div b{font-weight:normal;color:#333}

</style>
</head>
<body>
<div id="app"></div>

(function () {
  'use strict';
  var MX = window.MX;
  var DBN = 'moxie', ST = 'kv', LSP = 'moxie:';
  var mem = {};
  var mode = 'mem';
  var db = null;
  var pending = 0, waiters = [];
  var idbBad = false;       // an IndexedDB write failed: further writes also go to localStorage (merged back on next start)
  var warned = false;

  function open() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) return rej(new Error('no idb'));

      r.onsuccess = function () { if (done) return; done = true; clearTimeout(t); res(r.result); };
      r.onerror = function () { if (done) return; done = true; clearTimeout(t); rej(r.error || new Error('idb error')); };
      r.onblocked = function () { if (done) return; done = true; clearTimeout(t); rej(new Error('idb blocked')); };
    });

  function loadAllIdb() {
    return new Promise(function (res, rej) {
      var tx = db.transaction(ST, 'readonly'), out = {};
      var c = tx.objectStore(ST).openCursor();
      c.onsuccess = function () {
        var cur = c.result;
        if (cur) { out[cur.key] = cur.value; cur.continue(); }
      };
      tx.oncomplete = function () { res(out); };
      tx.onerror = function () { rej(tx.error); };
      tx.onabort = function () { rej(tx.error || new Error('abort')); };
    });
  }
  function lsAvailable() {
    try { var k = LSP + '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; }
  }
  function loadAllLs() {
    var out = {};

  }

    } catch (e) { MX.err(e); return false; }

  }

(function () {
  'use strict';
  var MX = window.MX;
  var CJK_RE = /[㐀-䶿一-鿿豈-﫿]|[\ud840-\ud87f][\udc00-\udfff]/;

  var STEMS = '甲乙丙丁戊己庚辛壬癸';
  var BRANCHES = '子丑寅卯辰巳午未申酉戌亥';
  var NUM = '一二三四五六七八九十';
  // chars that differ between scripts in the date line: 歲/岁 閏/闰 臘/腊
  var TO_SIMP = { '歲': '岁', '閏': '闰', '臘': '腊' };
  var TO_TRAD = { '岁': '歲', '闰': '閏', '腊': '臘' };

  function conv(s, map) {
    return Array.from(s).map(function (c) { return map[c] || c; }).join('');
  }

    var i = year - 4;

  }
  function cnMonth(m) {

  }

  MX.Closing = {
    CJK_RE: CJK_RE,
    isCJK: function (ch) { return CJK_RE.test(ch); },
    verse: {
      trad: '願以此功德，普及於一切，我等與眾生，皆共成佛道。',

    // Lunar-calendar date line such as 歲次丙午年九月 (falls back to Gregorian month).
    dateLine: function (script, d) {

<script>
(function () {
  'use strict';
  var MX = window.MX;
  var DIMS = { L: [4, 5], M: [6, 8], S: [8, 10] };

  // Build the cell sequence for a copy. A cell has a stable index (its position in this array),
  // independent of page size/orientation, so ink survives re-layout.
  function buildCells(text, cfg, signStr) {
    var script = cfg.script === 'simp' ? 'simp' : 'trad';
    var cells = [];
    function addSection(str, sec, keepAll) {
      Array.from(str || '').forEach(function (c) {
        if (/\s/.test(c)) return;
        if (keepAll || MX.Closing.isCJK(c)) cells.push({ ch: c, sec: sec, punct: '' });
        else {
          // punctuation attaches to the previous cell of the same section (never occupies a cell)
          for (var i = cells.length - 1; i >= 0; i--) {
            if (cells[i].sec === sec) { cells[i].punct += c; break; }
            break;
          }
        }
      });
    }
    if (cfg.title) addSection(text.title[script], 'title', true);
    addSection(text.body[script], 'body', false);
    if (cfg.closing) addSection(MX.Closing.verse[script], 'body', false);
    if (cfg.sign && signStr) addSection(signStr, 'tail', true);
    return cells;
  }

  // Pages = arrays of cell indices (or -1 for an unused slot). Title cells get their own page(s).
  function paginate(cells, perPage) {
    var pages = [], cur = [];
    function flush() {
      if (!cur.length) return;
      while (cur.length < perPage) cur.push(-1);
      pages.push(cur); cur = [];
    }
    var inTitle = true;
    cells.forEach(function (c, i) {
      if (inTitle && c.sec !== 'title') { flush(); inTitle = false; }
      if (c.sec !== 'title') inTitle = false;
      cur.push(i);
      if (cur.length === perPage) flush();
    });
    flush();
    if (!pages.length) { var e = []; for (var k = 0; k < perPage; k++) e.push(-1); pages.push(e); }
    return pages;
  }

  function grid(W, H, cfg) {
    var portrait = W < H;
    var d = DIMS[cfg.size] || DIMS.M;
    var cols = portrait ? d[0] : d[1], rows = portrait ? d[1] : d[0];
    var cell = Math.max(10, Math.floor(Math.min(W / cols, H / rows)));
    return {
      cols: cols, rows: rows, perPage: cols * rows, cell: cell, portrait: portrait,
      ox: Math.floor((W - cell * cols) / 2), oy: Math.floor((H - cell * rows) / 2),
      dir: cfg.dir === 'h' ? 'h' : 'v', W: W, H: H
    };
  }
  // slot (0..perPage-1, reading order) -> column,row (0-based from the left/top)
  function slotToColRow(g, s) {
    if (g.dir === 'v') return { col: g.cols - 1 - Math.floor(s / g.rows), row: s % g.rows };
    return { col: s % g.cols, row: Math.floor(s / g.cols) };
  }
  function colRowToSlot(g, col, row) {
    if (g.dir === 'v') return (g.cols - 1 - col) * g.rows + row;
    return row * g.cols + col;
  }

  MX.Layout = {
    DIMS: DIMS, buildCells: buildCells, paginate: paginate, grid: grid,
    slotToColRow: slotToColRow, colRowToSlot: colRowToSlot
  };
})();

  var DEF_SETTINGS = {
    acceptTouch: false, inkWidth: 'mid', tplStyle: 'fill', tplTone: 'mid',
    name: '', perf: false, pressure: 'auto', autoNext: true, touchPrompted: false
  };
  var DEF_CFG = {
    script: 'trad', mode: 'trace', grid: 'mi', size: 'M', dir: 'v', punct: 'hide',
    title: false, closing: false, sign: false
  };
  var CONTENT_KEYS = ['script', 'title', 'closing', 'sign'];

  function assign(t) {
    for (var i = 1; i < arguments.length; i++) {
      var s = arguments[i];
      if (s) Object.keys(s).forEach(function (k) { t[k] = s[k]; });
    }
    return t;
  }
  var META = ['id', 'textId', 'status', 'createdAt', 'updatedAt', 'cfg', 'signStr', 'pos', 'activeMs',
    'filled', 'total', 'completedAt', 'archivedAt'];

  var M = MX.Model = {
    CONTENT_KEYS: CONTENT_KEYS, DEF_CFG: DEF_CFG, DEF_SETTINGS: DEF_SETTINGS,
    copies: {},

    init: function () {
      // Stored-data schema marker. Records only ever gain optional fields (defaults are merged below), so
      // schema 1 needs no migration; put future migrations here, keyed on the stored value.
      var sv = Store.get('schema');
      if (!(sv >= 1)) Store.set('schema', 1);
      M.settings = assign({}, DEF_SETTINGS, Store.get('settings'));
      M.copies = {};
      Store.keys('copy:').forEach(function (k) {
        var c = Store.get(k);
        if (c && c.id) { c.cfg = assign({}, DEF_CFG, c.cfg); M.copies[c.id] = c; }
      });
    },
    saveSettings: function () { Store.set('settings', M.settings); },
    textCfg: function (textId) { return assign({}, DEF_CFG, Store.get('textcfg:' + textId)); },
    saveTextCfg: function (textId, cfg) { Store.set('textcfg:' + textId, assign({}, cfg)); },

    activeCopy: function (textId) {
      var best = null;
      Object.keys(M.copies).forEach(function (id) {
        var c = M.copies[id];
        if (c.textId === textId && c.status === 'active' && (!best || c.createdAt > best.createdAt)) best = c;
      });
      return best;
    },
    archived: function (textId) {
      return Object.keys(M.copies).map(function (id) { return M.copies[id]; })
        .filter(function (c) { return c.textId === textId && c.status === 'archived'; })
        .sort(function (a, b) { return (b.archivedAt || 0) - (a.archivedAt || 0); });
    },
    doneCount: function (textId) {
      return Store.keys('done:').filter(function (k) { var d = Store.get(k); return d && d.textId === textId; }).length;
    },
    doneList: function () { return Store.keys('done:').map(function (k) { return Store.get(k); }); },

    create: function (textId, cfg, signStr, total) {
      var now = Date.now();
      var c = {
        id: MX.uid(), textId: textId, status: 'active', createdAt: now, updatedAt: now,
        cfg: assign({}, DEF_CFG, cfg), signStr: signStr || '', pos: 0, activeMs: 0,
        filled: 0, total: total || 0, completedAt: null, archivedAt: null
      };
      c.ink = {};
      M.copies[c.id] = c;
      M.saveMeta(c);
      return c;
    },
    // ink is kept per cell under "ink:<copyId>:<cell>"; loaded lazily
    loadInk: function (c) {
      if (c.ink) return c;
      c.ink = {};
      var pre = 'ink:' + c.id + ':';
      Store.keys(pre).forEach(function (k) {
        var v = Store.get(k);
        if (v && v.length) c.ink[k.slice(pre.length)] = v;
      });
      return c;
    },
    saveMeta: function (c) {
      var o = {};
      META.forEach(function (k) { o[k] = c[k]; });
      Store.set('copy:' + c.id, o);
    },
    markDirty: function (c, idx) {
      if (!c._dirty) c._dirty = {};
      c._dirty[idx] = 1;
      c.updatedAt = Date.now();
    },
    recount: function (c) {
      var n = 0;
      Object.keys(c.ink || {}).forEach(function (k) {
        if (c.ink[k].length && +k < c.total) n++;
      });
      c.filled = n;
      return n;
    },
    flush: function (c) {
      if (!c) return;
      if (c._dirty) {
        Object.keys(c._dirty).forEach(function (idx) {
          var key = 'ink:' + c.id + ':' + idx, v = c.ink[idx];
          if (v && v.length) Store.set(key, v); else Store.del(key);
        });
        c._dirty = null;
      }
      M.saveMeta(c);
    },
    archive: function (c) {
      M.flush(c);
      c.status = 'archived'; c.archivedAt = Date.now();
      M.saveMeta(c);
    },
    remove: function (c) {
      Store.keys('ink:' + c.id + ':').forEach(function (k) { Store.del(k); });
      Store.del('copy:' + c.id);
      delete M.copies[c.id];
    },
    addDone: function (c) {
      var d = {
        id: MX.uid(), copyId: c.id, textId: c.textId, script: c.cfg.script, mode: c.cfg.mode,
        date: new Date().toISOString(), ts: Date.now(), duration: c.activeMs
      };
      Store.set('done:' + d.id, d);
      return d;
    },
    pending: function () { return Object.keys(M.copies).map(function (k) { return M.copies[k]; }); },
    flushAll: function () {
      Object.keys(M.copies).forEach(function (id) { if (M.copies[id]._dirty) M.flush(M.copies[id]); });
    }
  };
})();

<script>
(function () {
  'use strict';
  var MX = window.MX;
  var D = MX.Draw = {};

  D.INK_W = { thin: 13, mid: 22, thick: 36 };   // base width in 1/1000 cell units (at p = 0.5)
  D.TONE = { light: '#c4c4c4', mid: '#a8a8a8', dark: '#858585' };
  D.GRID_OUT = '#cfcfcf';
  D.GRID_GUIDE = '#e3e3e3';

  D.fam = function (script) {
    return script === 'simp'
      ? '"MoKai SC","LXGW WenKai","Kaiti SC","STKaiti","KaiTi","Noto Serif CJK SC",serif'
      : '"MoKai TC","LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","Noto Serif CJK TC",serif';
  };

  function wOf(base, p, sc) {
    var w = base * (0.3 + 1.4 * p / 1000) * sc;
    return w < 0.9 ? 0.9 : w;
  }
  // Paint ink segments k0..k1 of a flat [x,y,p,...] stroke (cell-local 0..1000 units).
  // ox,oy = cell origin in px; sc = px per unit. fin=true also paints the closing segment.
  D.paint = function (ctx, pts, ox, oy, sc, k0, k1, fin, base) {
    var n = pts.length / 3;
    if (!n) return;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#000'; ctx.fillStyle = '#000';
    if (n === 1) {
      if (fin) {
        ctx.beginPath();
        ctx.arc(ox + pts[0] * sc, oy + pts[1] * sc, wOf(base, pts[2], sc) / 2, 0, 6.2832);
        ctx.fill();
      }
      return;
    }
    var k, ax, ay, bx, by, cx, cy;
    for (k = Math.max(1, k0); k <= k1 && k < n; k++) {
      cx = ox + pts[k * 3] * sc; cy = oy + pts[k * 3 + 1] * sc;
      ctx.beginPath();
      if (k === 1) {
        ax = ox + pts[0] * sc; ay = oy + pts[1] * sc;
        ctx.moveTo(ax, ay);
        ctx.lineTo((ax + cx) / 2, (ay + cy) / 2);
        ctx.lineWidth = wOf(base, (pts[2] + pts[5]) / 2, sc);
      } else {
        ax = ox + pts[(k - 2) * 3] * sc; ay = oy + pts[(k - 2) * 3 + 1] * sc;
        bx = ox + pts[(k - 1) * 3] * sc; by = oy + pts[(k - 1) * 3 + 1] * sc;
        ctx.moveTo((ax + bx) / 2, (ay + by) / 2);
        ctx.quadraticCurveTo(bx, by, (bx + cx) / 2, (by + cy) / 2);
        ctx.lineWidth = wOf(base, pts[(k - 1) * 3 + 2], sc);
      }
      ctx.stroke();
    }
    if (fin) {
      ax = ox + pts[(n - 2) * 3] * sc; ay = oy + pts[(n - 2) * 3 + 1] * sc;
      bx = ox + pts[(n - 1) * 3] * sc; by = oy + pts[(n - 1) * 3 + 1] * sc;
      ctx.beginPath();
      ctx.moveTo((ax + bx) / 2, (ay + by) / 2);
      ctx.lineTo(bx, by);
      ctx.lineWidth = wOf(base, pts[(n - 1) * 3 + 2], sc);
      ctx.stroke();
    }
  };
  D.paintFull = function (ctx, pts, ox, oy, sc, base) {
    D.paint(ctx, pts, ox, oy, sc, 1, pts.length / 3 - 1, true, base);
  };

  // Draw one glyph centred in a box (cx,cy centre; size = em box in px).
  D.glyph = function (ctx, ch, cx, cy, size, o) {
    ctx.save();
    ctx.font = Math.round(size) + 'px ' + D.fam(o.script);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    var m = ctx.measureText(ch), y = cy;
    if (m && m.actualBoundingBoxAscent !== undefined) y = cy + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
    else y = cy + size * 0.35;
    if (o.style === 'outline' || o.style === 'dotted') {
      ctx.strokeStyle = o.color; ctx.lineWidth = Math.max(1, size / 60);
      if (o.style === 'dotted') ctx.setLineDash([Math.max(2, size / 40), Math.max(3, size / 28)]);
      ctx.strokeText(ch, cx, y);
    } else {
      ctx.fillStyle = o.color;
      ctx.fillText(ch, cx, y);
    }
    ctx.restore();
  };

  // Draw the cell background: grid, template/reference, punctuation.
  // o: {grid, mode, script, tplStyle, tplColor, punct (bool), tpl (bool: show template in this cell)}
  D.cell = function (ctx, x, y, size, cell, o) {
    ctx.save();
    if (o.grid !== 'none') {
      ctx.setLineDash([]);
      ctx.strokeStyle = D.GRID_OUT; ctx.lineWidth = 1.5;
      ctx.strokeRect(x + 0.75, y + 0.75, size - 1.5, size - 1.5);
      ctx.strokeStyle = D.GRID_GUIDE; ctx.lineWidth = 1;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(x + size / 2, y + 2); ctx.lineTo(x + size / 2, y + size - 2);
      ctx.moveTo(x + 2, y + size / 2); ctx.lineTo(x + size - 2, y + size / 2);
      if (o.grid === 'mi') {
        ctx.moveTo(x + 2, y + 2); ctx.lineTo(x + size - 2, y + size - 2);
        ctx.moveTo(x + size - 2, y + 2); ctx.lineTo(x + 2, y + size - 2);
      }
      ctx.stroke();
    }
    ctx.restore();
    if (o.mode === 'copy') {
      D.glyph(ctx, cell.ch, x + size * 0.17, y + size * 0.17, size * 0.26, { script: o.script, style: 'fill', color: '#333' });
    } else if (o.tpl) {
      D.glyph(ctx, cell.ch, x + size / 2, y + size / 2, size * 0.8, { script: o.script, style: o.tplStyle, color: o.tplColor });
    }
    if (o.punct && cell.punct) {
      D.glyph(ctx, cell.punct, x + size * 0.84, y + size * 0.86, size * 0.2, { script: o.script, style: 'fill', color: '#555' });
    }
  };

  // Make sure the web fonts are loaded before painting glyphs.
  var fontsOk = {};
  D.fontsReady = function (script, text) {
    var key = script;
    if (fontsOk[key]) return Promise.resolve();
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    var spec = '40px ' + (script === 'simp' ? '"MoKai SC"' : '"MoKai TC"');
    var p = document.fonts.load(spec, text || '墨').then(function () { fontsOk[key] = true; }, function () {});
    return Promise.race([p, new Promise(function (r) { setTimeout(r, 3000); })]);
  };
  D.fontsLoaded = function (script) { return !!fontsOk[script] || !(document.fonts && document.fonts.load); };
})();

<script>
(function () {
  'use strict';
  var MX = window.MX, h = MX.h;
  var CELL = 200, MARGIN = 24, MAXPX = 15000;

  function exportGrid(cfg, portrait, cell) {
    var g = MX.Layout.grid(portrait ? 3 : 4, portrait ? 4 : 3, cfg);
    g.cell = cell; g.ox = MARGIN; g.oy = MARGIN;
    g.W = g.cols * cell + 2 * MARGIN; g.H = g.rows * cell + 2 * MARGIN;
    return g;
  }
  function paintPage(ctx2d, g, pages, pageIdx, cp, opts, yOff) {
    var cfg = cp.copy.cfg, st = MX.Model.settings;
    var color = MX.Draw.TONE[st.tplTone] || MX.Draw.TONE.mid;
    var base = MX.Draw.INK_W[st.inkWidth] || 22;
    ctx2d.fillStyle = '#fff';
    ctx2d.fillRect(0, yOff, g.W, g.H);
    var page = pages[pageIdx];
    for (var s = 0; s < page.length; s++) {
      var idx = page[s];
      if (idx < 0) continue;
      var cr = MX.Layout.slotToColRow(g, s), x = g.ox + cr.col * g.cell, y = yOff + g.oy + cr.row * g.cell;
      MX.Draw.cell(ctx2d, x, y, g.cell, cp.cells[idx], {
        grid: opts.grid ? (cfg.grid === 'none' ? 'tian' : cfg.grid) : 'none',
        mode: opts.tpl ? cfg.mode : 'x', script: cfg.script, tplStyle: st.tplStyle, tplColor: color,
        punct: opts.tpl && cfg.punct === 'show', tpl: opts.tpl
      });
      var strokes = cp.copy.ink[idx] || [];
      for (var i = 0; i < strokes.length; i++) MX.Draw.paintFull(ctx2d, strokes[i], x, y, g.cell / 1000, base);
    }
  }
  function mk(w, hgt) {
    var c = document.createElement('canvas'); c.width = w; c.height = hgt;
    return c;
  }
  function stamp(cp) {
    return MX.fmtDate(Date.now());
  }

  var E = MX.Export = {
    // cp = {copy, text, cells}
    ctx: function (copy, text, cells) { return { copy: copy, text: text, cells: cells }; },
    pageCount: function (cp, portrait) {
      var g = exportGrid(cp.copy.cfg, portrait, CELL);
      return MX.Layout.paginate(cp.cells, g.perPage).length;
    },
    // scope: 'page' | 'all' | 'each'; returns [{name, dataUrl, w, h}]
    build: async function (cp, scope, o) {
      o = o || {};
      var opts = { grid: o.grid !== false, tpl: !!o.tpl };
      var portrait = o.portrait !== false;
      var cfg = cp.copy.cfg;
      if (opts.tpl) await MX.Draw.fontsReady(cfg.script, cp.cells.map(function (c) { return c.ch; }).join('').slice(0, 400));
      var cell = CELL;
      var g = exportGrid(cfg, portrait, cell);
      var pages = MX.Layout.paginate(cp.cells, g.perPage);
      var prefix = 'moxie-' + cp.copy.textId + '-' + stamp(cp);
      var out = [], ctx2d, c, i;
      if (scope === 'page') {
        var pi = MX.clamp(o.page || 0, 0, pages.length - 1);
        c = mk(g.W, g.H); ctx2d = c.getContext('2d');
        paintPage(ctx2d, g, pages, pi, cp, opts, 0);
        out.push({ name: prefix + '-p' + (pi + 1) + '.png', dataUrl: c.toDataURL('image/png'), w: g.W, h: g.H });
      } else if (scope === 'each') {
        for (i = 0; i < pages.length; i++) {
          c = mk(g.W, g.H); ctx2d = c.getContext('2d');
          paintPage(ctx2d, g, pages, i, cp, opts, 0);
          out.push({ name: prefix + '-p' + (i + 1) + '.png', dataUrl: c.toDataURL('image/png'), w: g.W, h: g.H });
        }
      } else {
        // stack all pages vertically; shrink cells if the result would be too tall
        var total = g.H * pages.length;
        if (total > MAXPX) {
          cell = Math.max(40, Math.floor((MAXPX / pages.length - 2 * MARGIN) / g.rows));
          g = exportGrid(cfg, portrait, cell);
        }
        c = mk(g.W, g.H * pages.length); ctx2d = c.getContext('2d');
        ctx2d.fillStyle = '#fff'; ctx2d.fillRect(0, 0, c.width, c.height);
        for (i = 0; i < pages.length; i++) {
          paintPage(ctx2d, g, pages, i, cp, opts, i * g.H);
          if (i) { ctx2d.fillStyle = '#ccc'; ctx2d.fillRect(0, i * g.H, g.W, 1); }
        }
        out.push({ name: prefix + '-all.png', dataUrl: c.toDataURL('image/png'), w: c.width, h: c.height });
      }
      return out;
    },
    run: async function (cp, scope, o) {
      var files = await E.build(cp, scope, o), st = '';
      for (var i = 0; i < files.length; i++) st = await MX.saveFile(files[i].name, files[i].dataUrl, 'image/png');
      MX.toast(st);
      return files;
    },
    openSheet: function (cp, curPage, portrait) {
      var o = { scope: 'page', grid: true, tpl: false };
      var scopeSeg = MX.Form.seg([['page', '本頁'], ['all', '整份 (疊成一張)'], ['each', '逐頁下載']], o.scope, function (v) { o.scope = v; });
      var gridSeg = MX.Form.seg([[true, '有'], [false, '無']], o.grid, function (v) { o.grid = v; });
      var tplSeg = MX.Form.seg([[true, '有'], [false, '無']], o.tpl, function (v) { o.tpl = v; });
      MX.modal({
        title: '匯出圖片 (PNG)',
        body: [
          MX.Form.row('範圍', scopeSeg), MX.Form.row('格線', gridSeg), MX.Form.row('範本字', tplSeg),
          h('div', { class: 'note', text: '預設只輸出您的字跡與淡格線。' })
        ],
        buttons: [
          { label: '取消', act: 'cancel' },
          { label: '匯出', act: 'export', primary: true, onClick: function () {
            E.run(cp, o.scope, { grid: o.grid, tpl: o.tpl, page: curPage, portrait: portrait }).catch(function (e) { MX.err(e); MX.toast('匯出失敗'); });
          } }
        ]
      });
    },

    // ---- whole-app data backup ----
    json: function () {
      MX.Model.flushAll();
      return JSON.stringify({ app: 'moxie', version: 1, exportedAt: new Date().toISOString(), entries: MX.Store.exportAll() });
    },
    saveJson: async function () {
      var st = await MX.saveFile('moxie-backup-' + MX.fmtDate(Date.now()) + '.json', new Blob([E.json()], { type: 'application/json' }), 'application/json');
      MX.toast(st);
    },
    importText: function (text) {
      var o;
      try { o = JSON.parse(text); } catch (e) { throw new Error('不是有效的 JSON'); }
      if (!o || o.app !== 'moxie' || !o.entries || typeof o.entries !== 'object') throw new Error('不是墨的備份檔');
      MX.Store.importAll(o.entries);
      MX.Model.init();
      return Object.keys(o.entries).length;
    }
  };
})();

<script>
(function () {
  'use strict';
  var MX = window.MX, h = MX.h, Draw = MX.Draw, Layout = MX.Layout, Model = MX.Model;
  var S = null;          // active practice state
  var showSeq = 0;

  function settings() { return Model.settings; }
  function bridge() { return window.MoBridge || null; }
  function keepOn(v) {
    try { var b = bridge(); if (b && typeof b.keepScreenOn === 'function') b.keepScreenOn(!!v); } catch (e) { MX.err(e); }
  }
  function inkBase() { return Draw.INK_W[settings().inkWidth] || Draw.INK_W.mid; }

  // ------------------------------------------------------------------ show / hide
  var P = MX.Practice = {
    show: async function (root, copyId, opts) {
      P.hide();
      var seq = ++showSeq;
      var copy = Model.copies[copyId];
      if (!copy) { location.hash = '#/'; return; }

      var text;

      h('div', { text: '筆似乎以「觸控」回報。是否允許手指／觸控書寫？' }),
      h('div', { class: 'btnrow' }, [
        h('button', { text: '允許', 'data-act': 'allow-touch', onclick: function () {
          settings().acceptTouch = true; settings().touchPrompted = true; Model.saveSettings(); closeBanner(); MX.toast('已允許觸控書寫');
        } }),
        h('button', { text: '不用', 'data-act': 'deny-touch', onclick: function () {
          settings().touchPrompted = true; Model.saveSettings(); closeBanner();
        } })
      ])
    ]);
    S.stage.appendChild(S.banner);
  }
  function closeBanner() { if (S && S.banner) { if (S.banner.parentNode) S.banner.parentNode.removeChild(S.banner); S.banner = null; } }

  // ------------------------------------------------------------------ sheets
  function cp() { return MX.Export.ctx(S.copy, S.text, S.cells); }
  function openExport() {
    MX.Export.openSheet(cp(), S.pageIdx, S.g.portrait);
  }
  function openSettings() {
    if (!S) return;
    var cfgFields = MX.Form.CFG.filter(function (f) { return !f.content; });
    var body = [
      MX.Form.build(cfgFields, S.cfg, false, function (k) {
        Model.saveMeta(S.copy); Model.saveTextCfg(S.copy.textId, S.cfg);
        S.copy.pos = firstIdx(S.pages[S.pageIdx]);
        layout();
      }),
      h('h2', { text: '筆與範本' }),
      MX.Form.build(MX.Form.SETTINGS, settings(), false, function () {
        Model.saveSettings();
        layout();
      })
    ];
    MX.modal({
      title: '設定', body: body,
      buttons: [
        { label: '匯出圖片', act: 'export', onClick: function () { openExport(); } },
        { label: '新抄一遍', act: 'newcopy', onClick: function () { newCopy(); } },
        { label: '完成', act: 'done', primary: true }
      ]
    });
  }
  async function newCopy() {
    if (!S) return;
    var c = S.copy, msg = c.completedAt ? '將目前這一遍存檔，重新開始新的一遍？' : '這一遍尚未完成。仍要存檔並重新開始？';
    var ok = await MX.confirm(msg, '新抄一遍', '新抄一遍');
    if (!ok || !S) return;
    Model.archive(c);
    location.replace('#/setup/' + c.textId + '?new=1');   // replace: Back must not return to the archived copy
  }
  function complete() {
    var c = S.copy;
    c.completedAt = Date.now();
    Model.flush(c);
    Model.addDone(c);
    var n = Model.doneCount(c.textId);
    MX.modal({
      title: '圓滿完成',
      body: [h('p', { text: '這是第 ' + n + ' 遍。用時約 ' + MX.fmtDuration(c.activeMs) + '。' })],
      buttons: [
        { label: '匯出圖片', act: 'export', onClick: function () { if (S) openExport(); } },
        { label: '新抄一遍', act: 'newcopy', onClick: function () { newCopy(); } },
        { label: '繼續', act: 'continue', primary: true }
      ]
    });
  }

  // ------------------------------------------------------------------ test hooks
  MX.test = {
    info: function () {
      if (!S) return null;
      var r = S.ink.getBoundingClientRect(), g = S.g, page = S.pages[S.pageIdx], cells = [];
      page.forEach(function (idx, s) {
        var o = slotOrigin(s);
        cells.push({ slot: s, idx: idx, ch: idx >= 0 ? S.cells[idx].ch : '', punct: idx >= 0 ? S.cells[idx].punct : '',
          col: o.col, row: o.row, x: r.left + o.x, y: r.top + o.y, size: g.cell });
      });
      return { page: S.pageIdx, pages: S.pages.length, cols: g.cols, rows: g.rows, cell: g.cell, dir: g.dir, portrait: g.portrait,
        perPage: g.perPage, total: S.cells.length, filled: S.copy.filled, cells: cells, copyId: S.copy.id, completed: !!S.copy.completedAt,
        mode: S.cfg.mode, nextBtn: !!S.nextBtn, pressureSeen: S.pressureSeen, hint: S.hint };
    },
    go: go,
    cellsAll: function () { return S ? S.cells.map(function (c) { return c.ch; }).join('') : ''; },
    inkOf: function (idx) { return S ? (S.copy.ink[idx] || []) : []; },
    setPos: function (p) { if (S) { S.copy.pos = p; layout(); } }
  };
})();

</script>
<script>
(function () {
  'use strict';
  var MX = window.MX, h = MX.h, Model = MX.Model, Store = MX.Store;
  var S = MX.Screens = {};

  function screen(root, title, backHash, extra) {
    var el = h('div', { class: 'screen' });
    var top = h('div', { class: 'topbar' }, [h('h1', { class: 'grow', text: title })]);
    if (extra) extra.forEach(function (n) { top.appendChild(n); });
    if (backHash) top.appendChild(h('button', { text: '返回', 'data-act': 'back', onclick: function () { location.hash = backHash; } }));
    el.appendChild(top);
    root.appendChild(el);
    return el;
  }
  function assign(t, s) { Object.keys(s).forEach(function (k) { t[k] = s[k]; }); return t; }

  // ------------------------------------------------------------------ home
  S.home = function (root) {
    var el = screen(root, '墨 · 抄經', null, [
      h('button', { text: '筆測', 'data-act': 'pentest', onclick: function () { location.hash = '#/pentest'; } }),
      h('button', { text: '設定', 'data-act': 'settings', onclick: function () { location.hash = '#/settings'; } })
    ]);
    el.setAttribute('data-screen', 'home');
    var texts = MX.Library.texts();
    texts.forEach(function (t) {
      var cfg = Model.textCfg(t.id), copy = Model.activeCopy(t.id);
      if (copy) cfg = copy.cfg;
      var pct = copy && copy.total ? Math.floor(100 * copy.filled / copy.total) : 0;
      var done = Model.doneCount(t.id), arch = Model.archived(t.id).length;
      var title = t.title[cfg.script === 'simp' ? 'simp' : 'trad'];
      var card = h('div', { class: 'card', 'data-text': t.id }, [
        h('div', { class: 't', text: title, style: 'font-family:' + MX.Draw.fam(cfg.script) }),
        h('div', { class: 'm', 'data-role': 'meta', text: t.chars + '字 · 進度 ' + pct + '% · 已抄 ' + done + ' 遍' }),
        h('div', { class: 'bar' }, [h('i', { style: 'width:' + pct + '%' })])
      ]);
      var row = h('div', { class: 'btnrow' });
      row.appendChild(h('button', {
        class: 'on', 'data-act': 'start', text: copy ? '繼續' : '開始',
        onclick: function () { location.hash = copy ? '#/practice/' + copy.id : '#/setup/' + t.id; }
      }));
      row.appendChild(h('button', { 'data-act': 'setup', text: '設定', onclick: function () { location.hash = '#/setup/' + t.id; } }));
      if (arch) row.appendChild(h('button', { 'data-act': 'archives', text: '存檔 (' + arch + ')', onclick: function () { location.hash = '#/archives/' + t.id; } }));
      card.appendChild(row);
      if (t.description) card.appendChild(h('div', { class: 'note', text: t.description }));
      el.appendChild(card);
    });
    if (!texts.length) el.appendChild(h('p', { text: '文庫是空的。' }));
    var ver = (document.querySelector('meta[name=mx-version]') || {}).content || '';
    el.appendChild(h('div', { class: 'note', text: (MX.Library.offline() ? '離線版 · ' : '') + '版本 ' + ver + ' · 儲存：' + Store.mode() }));
  };

  // ------------------------------------------------------------------ setup
  S.setup = function (root, textId, query) {
    var entry = MX.Library.entry(textId);
    if (!entry) { location.hash = '#/'; return; }
    var copy = Model.activeCopy(textId);
    if (copy) Model.loadInk(copy);
    var locked = !!(copy && Model.recount(copy) > 0);
    var d = assign({}, copy ? copy.cfg : Model.textCfg(textId));
    var el = screen(root, '設定 · ' + entry.title.trad, '#/');
    el.setAttribute('data-screen', 'setup');
    var info = h('div', { class: 'note', 'data-role': 'cellcount' });
    function signStr() { return d.sign ? MX.Closing.signLine(d.script, Model.settings.name) : ''; }
    function refreshInfo() {
      MX.Library.getText(textId).then(function (txt) {
        var cells = MX.Layout.buildCells(txt, d, signStr());
        info.textContent = '共 ' + cells.length + ' 格';
      });
    }
    el.appendChild(MX.Form.build(MX.Form.CFG, d, locked, refreshInfo));
    if (locked) el.appendChild(h('div', { class: 'note', text: '已開始書寫：字體、標題頁、迴向、落款需「新抄一遍」才能更改。' }));
    el.appendChild(info);
    refreshInfo();
    var row = h('div', { class: 'btnrow', style: 'margin-top:16px' });
    row.appendChild(h('button', {
      class: 'on big', 'data-act': 'go', text: copy ? '確定並繼續' : '開始抄寫',
      onclick: async function () {
        var txt = await MX.Library.getText(textId), c = copy;
        Model.saveTextCfg(textId, d);
        if (!c) {
          var ss = signStr();
          c = Model.create(textId, d, ss, MX.Layout.buildCells(txt, d, ss).length);
        } else {
          var contentChanged = MX.Model.CONTENT_KEYS.some(function (k) { return c.cfg[k] !== d[k]; });
          c.cfg = assign({}, d);
          if (contentChanged && !locked) {
            c.signStr = signStr();
            c.total = MX.Layout.buildCells(txt, c.cfg, c.signStr).length;
            c.pos = 0;
          }
          Model.saveMeta(c);
        }
        location.hash = '#/practice/' + c.id;
      }
    }));
    if (copy) {
      row.appendChild(h('button', {
        class: 'big', 'data-act': 'newcopy', text: '新抄一遍',
        onclick: async function () {
          var ok = await MX.confirm('將目前這一遍存檔，重新開始新的一遍？', '新抄一遍', '新抄一遍');
          if (!ok) return;
          Model.archive(copy);
          location.replace('#/setup/' + textId + '?new=' + Date.now());
        }
      }));
    }
    el.appendChild(row);
  };

  // ------------------------------------------------------------------ app settings
  S.settings = function (root) {
    var el = screen(root, '設定', '#/');
    el.setAttribute('data-screen', 'settings');
    var st = Model.settings;
    el.appendChild(MX.Form.build(MX.Form.SETTINGS, st, false, function () { Model.saveSettings(); }));
    var nameIn = h('input', { type: 'text', value: st.name || '', placeholder: '落款姓名（選填）', 'data-role': 'name',
      oninput: function () { st.name = nameIn.value; Model.saveSettings(); } });
    el.appendChild(MX.Form.row('姓名', nameIn));
    el.appendChild(h('h2', { text: '資料備份' }));
    var file = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none', 'data-role': 'import-file',
      onchange: function () {
        var f = file.files && file.files[0];
        if (!f) return;
        var fr = new FileReader();
        fr.onload = async function () {
          var ok = await MX.confirm('匯入會取代此裝置上的所有資料。', '匯入', '匯入備份');
          if (!ok) return;
          try {
            var n = MX.Export.importText(String(fr.result));
            MX.toast('已匯入 ' + n + ' 筆');
            location.hash = '#/';
          } catch (e) { MX.toast('匯入失敗：' + e.message); }
        };
        fr.readAsText(f);
        file.value = '';
      } });
    el.appendChild(h('div', { class: 'btnrow' }, [
      h('button', { text: '匯出資料 (JSON)', 'data-act': 'export-json', onclick: function () { MX.Export.saveJson().catch(function (e) { MX.err(e); MX.toast('匯出失敗'); }); } }),
      h('button', { text: '匯入資料', 'data-act': 'import-json', onclick: function () { file.click(); } }),
      file
    ]));
    el.appendChild(h('div', { class: 'note', text: '資料只存在這台裝置，不會上傳。' }));
    el.appendChild(h('div', { class: 'btnrow', style: 'margin-top:14px' }, [
      h('button', { text: '筆測頁', 'data-act': 'pentest', onclick: function () { location.hash = '#/pentest'; } })
    ]));
  };

  // ------------------------------------------------------------------ archives
  S.archives = function (root, textId) {
    var entry = MX.Library.entry(textId);
    var el = screen(root, '存檔 · ' + (entry ? entry.title.trad : ''), '#/');
    el.setAttribute('data-screen', 'archives');
    var list = Model.archived(textId);
    if (!list.length) el.appendChild(h('p', { text: '沒有存檔。' }));
    list.forEach(function (c) {
      var card = h('div', { class: 'card', 'data-copy': c.id }, [
        h('div', { class: 't', text: MX.fmtDate(c.archivedAt || c.updatedAt) }),
        h('div', { class: 'm', text: (c.cfg.script === 'simp' ? '简体' : '繁體') + ' · ' + { trace: '描', copy: '臨', recall: '默' }[c.cfg.mode] +
          ' · ' + c.filled + '/' + c.total + '格' + (c.completedAt ? ' · 已完成' : '') })
      ]);
      card.appendChild(h('div', { class: 'btnrow' }, [
        h('button', { text: '檢視', 'data-act': 'view', onclick: function () { location.hash = '#/view/' + c.id; } }),
        h('button', { text: '匯出', 'data-act': 'export', onclick: async function () {
          var txt = await MX.Library.getText(c.textId);
          Model.loadInk(c);
          var cells = MX.Layout.buildCells(txt, c.cfg, c.signStr);
          MX.Export.openSheet(MX.Export.ctx(c, txt, cells), 0, window.innerWidth < window.innerHeight);
        } }),
        h('button', { text: '刪除', 'data-act': 'delete', onclick: async function () {
          var ok = await MX.confirm('刪除這份存檔？無法復原。', '刪除', '刪除存檔');
          if (!ok) return;
          Model.remove(c);
          location.hash = '#/archives/' + textId + '?r=' + Date.now();
        } })
      ]));
      el.appendChild(card);
    });
  };
})();

</script>
<script>
(function () {
  'use strict';
  var MX = window.MX, h = MX.h;
  var T = MX.PenTest = {};
  var cur = null;

  function mm(o, v) { if (o.min === null || v < o.min) o.min = v; if (o.max === null || v > o.max) o.max = v; }
  function fmt(o) { return o.min === null ? '-' : (+o.min.toFixed(3)) + ' .. ' + (+o.max.toFixed(3)); }

  function caps() {
    var c = {};
    c.userAgent = navigator.userAgent;
    c.devicePixelRatio = window.devicePixelRatio;
    c.screen = screen.width + 'x' + screen.height;
    c.inner = window.innerWidth + 'x' + window.innerHeight;
    c.orientation = (screen.orientation && screen.orientation.type) || (window.innerWidth >= window.innerHeight ? 'landscape' : 'portrait');
    c.pointerFine = !!(window.matchMedia && matchMedia('(pointer:fine)').matches);
    c.anyPointerFine = !!(window.matchMedia && matchMedia('(any-pointer:fine)').matches);
    c.pointerCoarse = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
    c.hoverHover = !!(window.matchMedia && matchMedia('(hover:hover)').matches);
    c.maxTouchPoints = navigator.maxTouchPoints;
    c.PointerEvent = !!window.PointerEvent;
    c.getCoalescedEvents = !!(window.PointerEvent && PointerEvent.prototype.getCoalescedEvents);
    c.getPredictedEvents = !!(window.PointerEvent && PointerEvent.prototype.getPredictedEvents);
    try {
      var cv = document.createElement('canvas'), x = cv.getContext('2d', { desynchronized: true });
      c.desynchronized = !!(x.getContextAttributes && x.getContextAttributes().desynchronized);
    } catch (e) { c.desynchronized = false; }
    c.Path2D = !!window.Path2D;
    c.indexedDB = !!window.indexedDB;
    c.storeMode = MX.Store.mode();
    c.serviceWorker = 'serviceWorker' in navigator;
    c.moBridge = !!window.MoBridge;
    c.fontMoKaiTC = !!(document.fonts && document.fonts.check && document.fonts.check('20px "MoKai TC"', '墨'));
    c.version = (document.querySelector('meta[name=mx-version]') || {}).content || '';
    c.offlineBuild = MX.Library.offline();
    return c;
  }

  T.show = function (root) {
    T.hide();
    var st = {
      n: 0, types: {}, pressure: { min: null, max: null }, tiltX: { min: null, max: null }, tiltY: { min: null, max: null },
      coalMax: 0, hzMax: 0, times: [], buttons: {}, last: null, key: null, down: false
    };
    var el = h('div', { class: 'screen', 'data-screen': 'pentest' });
    el.appendChild(h('div', { class: 'topbar' }, [
      h('h1', { class: 'grow', text: '筆測' }),
      h('button', { text: '清除', 'data-act': 'clear', onclick: function () { clearCanvas(); } }),
      h('button', { text: '返回', 'data-act': 'back', onclick: function () { location.hash = '#/'; } })
    ]));
    var cv = h('canvas', { class: 'pt-area', id: 'pt-canvas' });
    el.appendChild(cv);
    var live = h('div', { class: 'pt-grid', 'data-role': 'live' });
    el.appendChild(live);
    var rep = h('textarea', { 'data-role': 'report', readonly: 'readonly' });
    var btns = h('div', { class: 'btnrow' }, [
      h('button', { class: 'on', text: '複製報告', 'data-act': 'copy', onclick: copyReport })
    ]);
    el.appendChild(btns);
    el.appendChild(rep);
    root.appendChild(el);

    var ctx = null, lastPt = null;
    function size() {
      var r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
      cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
      ctx = cv.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0);
      ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
    }
    function clearCanvas() { var r = cv.getBoundingClientRect(); ctx.clearRect(0, 0, r.width, r.height); }
    size();

    function rate() {
      var now = performance.now(), t = st.times;
      while (t.length && now - t[0] > 1000) t.shift();
      if (t.length > st.hzMax) st.hzMax = t.length;
      return t.length;
    }
    function record(e, coalesced) {
      st.n++;
      st.types[e.pointerType] = (st.types[e.pointerType] || 0) + 1;
      st.buttons[e.buttons] = 1;
      if (e.buttons || e.type === 'pointerdown') { mm(st.pressure, e.pressure); }
      mm(st.tiltX, e.tiltX || 0); mm(st.tiltY, e.tiltY || 0);
      if (coalesced > st.coalMax) st.coalMax = coalesced;
      st.times.push(performance.now());
      st.last = {
        type: e.type, pointerType: e.pointerType, pointerId: e.pointerId, pressure: e.pressure, tiltX: e.tiltX, tiltY: e.tiltY,
        twist: e.twist, buttons: e.buttons, button: e.button, width: e.width, height: e.height, coalesced: coalesced,
        x: Math.round(e.clientX), y: Math.round(e.clientY)
      };
    }
    function handle(e) {
      var list = null;
      if (typeof e.getCoalescedEvents === 'function') { try { list = e.getCoalescedEvents(); } catch (x) { list = null; } }
      var cn = list ? list.length : 0;
      record(e, cn);
      scheduleRender();
      if (e.type === 'pointerdown') { st.down = true; lastPt = null; }
      if (e.type === 'pointerup' || e.type === 'pointercancel') { st.down = false; lastPt = null; return; }
      if (!st.down || !e.buttons) return;
      var r = cv.getBoundingClientRect();
      var pts = list && list.length ? list : [e];
      pts.forEach(function (p) {
        var x = p.clientX - r.left, y = p.clientY - r.top, w = 1 + (p.pressure || 0.5) * 7;
        if (lastPt) { ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(lastPt[0], lastPt[1]); ctx.lineTo(x, y); ctx.stroke(); }
        lastPt = [x, y];
      });
    }
    ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'pointerover'].forEach(function (t) {
      cv.addEventListener(t, handle);
    });
    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    cv.style.touchAction = 'none';
    function onKey(e) { st.key = { key: e.key, code: e.code, keyCode: e.keyCode }; scheduleRender(); }
    document.addEventListener('keydown', onKey);
    function onMoKey(e) { st.key = { moKey: e.detail }; scheduleRender(); }
    window.addEventListener('mo-key', onMoKey);

    var renderT = null;
    function scheduleRender() { if (!renderT) renderT = setTimeout(function () { renderT = null; render(); }, 120); }
    function lines() {
      var c = caps(), l = st.last || {}, out = [];
      function add(k, v) { out.push([k, String(v)]); }
      add('pointerType (last)', l.pointerType || '-');
      add('pointerTypes seen', JSON.stringify(st.types));
      add('pressure (last)', l.pressure === undefined ? '-' : l.pressure);
      add('pressure range', fmt(st.pressure));
      add('tiltX/tiltY (last)', (l.tiltX === undefined ? '-' : l.tiltX) + ' / ' + (l.tiltY === undefined ? '-' : l.tiltY));
      add('tilt range X | Y', fmt(st.tiltX) + ' | ' + fmt(st.tiltY));
      add('buttons (last) / seen', (l.buttons === undefined ? '-' : l.buttons) + ' / ' + Object.keys(st.buttons).join(','));
      add('button (last)', l.button === undefined ? '-' : l.button);
      add('event rate Hz (now / max)', rate() + ' / ' + st.hzMax);
      add('coalesced (last / max)', (l.coalesced === undefined ? '-' : l.coalesced) + ' / ' + st.coalMax);
      add('contact w x h', (l.width === undefined ? '-' : l.width + 'x' + l.height));
      add('events total', st.n);
      add('last key', st.key ? JSON.stringify(st.key) : '-');
      Object.keys(c).forEach(function (k) { add(k, c[k]); });
      return out;
    }
    function render() {
      live.innerHTML = '';
      lines().forEach(function (kv) {
        live.appendChild(h('div', {}, [h('b', { text: kv[0] + ': ' }), kv[1]]));
      });
    }
    function reportText() {
      return '墨 pen-test report ' + new Date().toISOString() + '\n' +
        lines().map(function (kv) { return kv[0] + ': ' + kv[1]; }).join('\n');
    }
    function copyReport() {
      var text = reportText();
      rep.value = text;
      rep.style.display = 'block';
      function fallback() {
        rep.focus(); rep.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        MX.toast(ok ? '已複製報告' : '請長按文字框全選後複製');
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { MX.toast('已複製報告'); }, fallback);
      } else fallback();
    }
    render();
    cur = { el: el, onKey: onKey, onMoKey: onMoKey, report: reportText, state: st };
  };
  T.hide = function () {
    if (!cur) return;
    document.removeEventListener('keydown', cur.onKey);
    window.removeEventListener('mo-key', cur.onMoKey);
    cur = null;
  };
  T.report = function () { return cur ? cur.report() : ''; };
})();

</script>
<script>
(function () {
  'use strict';
  var MX = window.MX;
  var current = null;

  function root() { return document.getElementById('app'); }
  function parse() {
    var raw = (location.hash || '#/').slice(1);
    var q = '', i = raw.indexOf('?');
    if (i >= 0) { q = raw.slice(i + 1); raw = raw.slice(0, i); }
    var parts = raw.split('/').filter(Boolean).map(decodeURIComponent);
    return { name: parts[0] || 'home', arg: parts[1] || '', query: q };
  }
  function teardown() {
    if (MX.Practice) MX.Practice.hide();
    if (MX.PenTest) MX.PenTest.hide();
    MX.Model.flushAll();
    var layer = MX.layer();
    layer.innerHTML = '';
    root().innerHTML = '';
  }
  function route() {
    teardown();
    var r = parse(), el = root();
    current = r.name;
    try {
      switch (r.name) {
        case 'practice': MX.Practice.show(el, r.arg, { readOnly: false }); break;
        case 'view': MX.Practice.show(el, r.arg, { readOnly: true }); break;
        case 'setup': MX.Screens.setup(el, r.arg, r.query); break;
        case 'settings': MX.Screens.settings(el); break;
        case 'archives': MX.Screens.archives(el, r.arg); break;
        case 'pentest': MX.PenTest.show(el); break;
        default: MX.Screens.home(el);
      }
    } catch (e) {
      MX.err(e);
      el.appendChild(MX.h('div', { class: 'screen' }, [MX.h('h1', { text: '發生錯誤' }), MX.h('p', { class: 'mono', text: String(e && e.stack || e) }),
        MX.h('button', { text: '返回', onclick: function () { location.hash = '#/'; } })]));
    }
  }
  MX.route = route;

  async function boot() {
    var el = root();
    try {
      await MX.Store.init();
      MX.Model.init();
      await MX.Library.load();
    } catch (e) {
      MX.err(e);
      el.appendChild(MX.h('div', { class: 'screen' }, [
        MX.h('h1', { text: '無法載入文庫' }),
        MX.h('p', { text: '請用網址開啟，或使用「離線版」單一檔案。' }),
        MX.h('p', { class: 'mono', text: String(e && e.message || e) }),
        MX.h('button', { text: '重試', onclick: function () { location.reload(); } })
      ]));
      return;
    }
    window.addEventListener('hashchange', route);
    window.addEventListener('pagehide', function () { MX.Model.flushAll(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) MX.Model.flushAll(); });
    // native wrapper: Activity.onPause (the WebView may never see pagehide/visibilitychange before the process is killed)
    window.addEventListener('mo-pause', function () { MX.Model.flushAll(); });
    // native wrapper: Back button. true = handled here (the app stays open), false = let Android close the app.
    window.__moHandleBack = function () {
      try {
        if (MX.closeTopModal()) return true;
        if (current && current !== 'home') {
          if (history.length > 1) history.back(); else location.hash = '#/';
          return true;
        }
      } catch (e) { MX.err(e); }
      return false;
    };
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { /* ignore */ });
    } catch (e) { /* ignore */ }
    route();
    MX.ready = true;
    // service worker: hosted (http/https) only, never inside the native wrapper or file://
    if (!window.MoBridge && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      try {
        navigator.serviceWorker.register('sw.js').catch(function () { /* ignore */ });
      } catch (e) { /* ignore */ }
    }
  }
  boot();
})();

</script>
</body>
</html>
